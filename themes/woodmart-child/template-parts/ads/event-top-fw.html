<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Note: The Musical — Leaderboard, split cast (fluid, max 1168 × 250)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #e9e9e9;
            font-family: system-ui, sans-serif
        }

        .dnc-wrap {
            container-type: inline-size;
            width: 100%;
            max-width: 1168px;
            margin: 0 auto
        }

        .dnc {
            position: relative;
            display: block;
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #0a1526;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            font-family: 'Jost', 'Century Gothic', 'Futura', 'Trebuchet MS', system-ui, sans-serif;
            font-size: clamp(6.4px, 0.86cqw, 10px)
        }

        .dnc * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            pointer-events: none
        }

        .dnc-photo {
            position: absolute;
            right: 0;
            top: 0;
            width: 34%;
            height: 100%;
            overflow: hidden
        }

        .dnc-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 26%;
            animation: dnc-drift 12s ease-in-out infinite alternate
        }

        .dnc-fade {
            position: absolute;
            left: 52%;
            top: 0;
            width: 26%;
            height: 100%;
            background: linear-gradient(270deg, rgba(10, 21, 38, 0), rgba(10, 21, 38, .85) 55%, #0a1526 82%);
            z-index: 2
        }

        .dnc-in {
            position: absolute;
            left: 5%;
            right: 38%;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 3
        }

        .dnc-logo {
            width: 26em;
            max-width: 100%;
            max-height: 8.4em;
            height: auto;
            object-fit: contain;
            object-position: left;
            display: block
        }

        .dnc-q {
            font-size: 1.5em;
            font-weight: 500;
            font-style: italic;
            color: #cdd6e2;
            margin-top: 1.3em;
            line-height: 1.35;
            animation: dnc-up 13.5s ease-out infinite
        }

        .dnc-cta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.6em;
            margin-top: 1.5em;
            animation: dnc-pop 13.5s ease-out infinite
        }

        .dnc-dates {
            display: block;
            font-size: 2.2em;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            letter-spacing: .02em;
            white-space: nowrap
        }

        .dnc-sub {
            display: block;
            font-size: 1.2em;
            font-weight: 500;
            color: #aebac9;
            letter-spacing: .06em;
            margin-top: .3em;
            white-space: nowrap
        }

        .dnc-btn {
            padding: 1.1em 2.4em;
            background: #ff7d1e;
            color: #0a1526;
            font-size: 1.3em;
            font-weight: 700;
            letter-spacing: .08em;
            white-space: nowrap
        }

        @keyframes dnc-up {
            0% {
                opacity: 0;
                transform: translateY(10px)
            }

            8%,
            86% {
                opacity: 1;
                transform: translateY(0)
            }

            96%,
            100% {
                opacity: 0;
                transform: translateY(-6px)
            }
        }

        @keyframes dnc-pop {
            0% {
                opacity: 0;
                transform: scale(.92)
            }

            12%,
            86% {
                opacity: 1;
                transform: scale(1)
            }

            96%,
            100% {
                opacity: 0;
                transform: scale(.98)
            }
        }

        @keyframes dnc-drift {
            0% {
                transform: scale(1.06)
            }

            100% {
                transform: scale(1)
            }
        }

        @media (prefers-reduced-motion:reduce) {

            .dnc-q,
            .dnc-cta,
            .dnc-photo img {
                animation: none;
                opacity: 1;
                transform: none
            }
        }

        @container (max-width:820px) {
            .dnc-photo {
                width: 31%
            }

            .dnc-fade {
                left: 50%;
                width: 26%
            }

            .dnc-in {
                left: 6%;
                right: 34%
            }

            .dnc-logo {
                width: 23em
            }

            .dnc-q {
                font-size: 1.42em;
                margin-top: 1.1em
            }

            .dnc-cta {
                gap: 1.1em;
                margin-top: 1.2em
            }
        }

        @container (max-width:560px) {
            .dnc-photo {
                width: 100%;
                opacity: .34
            }

            .dnc-photo img {
                object-position: 52% 22%
            }

            .dnc-fade {
                left: 0;
                width: 100%;
                background: linear-gradient(90deg, #0a1526 26%, rgba(10, 21, 38, .6) 100%)
            }

            .dnc-in {
                left: 6.5%;
                right: 6.5%
            }

            .dnc-logo {
                width: 22em;
                max-width: 86%
            }

            .dnc-q {
                font-size: 1.4em;
                margin-top: 1em
            }

            .dnc-cta {
                gap: 1em;
                margin-top: 1.1em
            }
        }

        @container (max-width:400px) {
            .dnc-q {
                font-size: 1.35em
            }

            .dnc-cta {
                flex-direction: column;
                align-items: flex-start;
                gap: .85em;
                margin-top: .9em
            }

            .dnc-dates {
                font-size: 2em
            }

            .dnc-btn {
                padding: 1em 2em
            }
        }
    </style>
</head>

<body>

    <div class="dnc-wrap">
        <a class="dnc" href="https://www.barbican.org.uk/whats-on/2026/event/death-note-the-musical" target="_blank" rel="noopener sponsored"
            aria-label="Death Note: The Musical at the Barbican, 30 July to 12 September. Book tickets.">
            <span class="dnc-photo"><img src="https://www.japannakama.co.uk/wp-content/uploads/2026/07/dn-cast-portrait.jpg" alt=""></span>
            <span class="dnc-fade"></span>
            <span class="dnc-in">
                <img class="dnc-logo" src="https://www.japannakama.co.uk/wp-content/uploads/2026/07/leaderboard-970-logo.png" alt="Death Note: The Musical">
                <span class="dnc-q">If you had the power over life and death, what would you do?</span>
                <span class="dnc-cta">
                    <span>
                        <span class="dnc-dates">30 JUL &ndash; 12 SEP</span>
                        <span class="dnc-sub">BARBICAN, LONDON</span>
                    </span>
                    <span class="dnc-btn">BOOK TICKETS</span>
                </span>
            </span>
        </a>
    </div>

</body>

</html>
